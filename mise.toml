# Marks this repo as one the plugin sync manages, so entering it keeps the
# VSCode extensions in programs/tool/vscode-sync/plugins.nix installed.
#
# No tools: nothing here needs a runtime. The nix files are built by
# nixos-rebuild, which comes from the system rather than from mise.

[tools]

# The scripts under programs/ are plain shell files; see lib/shell-script.nix.
# The build shellchecks each command too, but this also follows the sourced
# helpers and covers the prompt hook. shellcheck comes from this flake's own
# locked nixpkgs, so there is still no tool to install or pin here.
[tasks.lint]
description = "shellcheck the scripts under programs/"
run = "nix shell --inputs-from . nixpkgs#shellcheck --command shellcheck --external-sources --source-path=SCRIPTDIR programs/*/*/*.sh"
