# -----------------------------------------------------------------
# System-wide mise settings, installed to /etc/mise/config.toml by
# environment.etc in configuration.nix.
#
# Project tooling is NOT declared here. Each repo carries its own
# mise.toml, because locking is scoped to a config root: tools inherited
# from a global or parent config never land in the project's own
# mise.lock, which is exactly the cross-machine drift this is meant to
# stop.
# -----------------------------------------------------------------

[settings]
# Both the lockfile and the enter hook below are gated behind this. Without it
# mise warns about the hook and silently skips writing mise.lock, which is a
# quiet way to lose the reproducibility the lockfile is here for.
#
# It is a broader switch than either feature: it opts into every experimental
# feature, and jdx uses it as a beta flag as well. There is no narrower one, and
# the hook is not optional for plugin sync, so this is the price of both.
experimental = true

# mise defaults this to true on NixOS, on the assumption that precompiled glibc
# binaries cannot run here. programs.nix-ld is what makes them run, so take the
# binaries: building every runtime from source is slow and needs a toolchain
# this box deliberately does not carry. Node's ./configure alone wants python.
#
# mise's automatic NixOS default is deprecated anyway, removed in 2027.8.0, so
# saying it explicitly is also the future-proof form.
all_compile = false

# Pin resolved versions per project. The spec in a repo's mise.toml can
# still float (node = "lts"); the lock records what every machine
# actually installs, and `mise up` bumps it when you decide to.
#
# Stated explicitly rather than relying on the default: older mise defaults it
# to true, newer mise needs it set before it will create a lockfile that does
# not already exist.
lockfile = true

# mise.toml is the single source of truth for this box. .nvmrc,
# package.json and global.json stay in project repos as documentation
# for contributors who don't run mise, but mise itself ignores them so
# there is never a question of which file won.
idiomatic_version_file_enable_tools = []

[hooks]
# Sync VSCode plugins on entering a project. See programs/vscode.nix.
# Only fires inside a trusted mise project, so a repo needs a mise.toml
# and one `mise trust`.
enter = "vscode-sync"
